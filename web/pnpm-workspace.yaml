blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@rotki/ui-library'
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'

trustPolicy: no-downgrade
trustPolicyExclude:
  # @rotki/ui-library pins this exact version. It is a hand-published backport on the
  # v2 LTS line with no provenance, while 2.5.5 and the 3.x line are CI-published, so
  # the policy reads it as a downgrade. Verified not a takeover: same publisher
  # account, matching GitHub release. Every repo that consumes ui-library carries the
  # same entry; it goes away once ui-library drops the dependency.
  - tailwind-merge@2.6.1

shellEmulator: true
strictDepBuilds: true
saveExact: true

overrides:
  chokidar: 5.0.0
  immutable: 5.1.9
  # oxfmt 0.35, which eslint-plugin-format caps us at, pins tinypool 2.1.0
  # (GHSA advisories fixed in 2.1.2).
  oxfmt>tinypool: 2.1.2

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
