blockExoticSubdeps: true

minimumReleaseAge: 10080
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@rotki/ui-library'
  - '@rotki/eslint-config'
  - '@rotki/eslint-plugin'

trustPolicy: no-downgrade
shellEmulator: true
strictDepBuilds: true
saveExact: true

overrides:
  # oxfmt 0.35, which eslint-plugin-format caps us at, pins tinypool 2.1.0
  # (GHSA advisories fixed in 2.1.2).
  oxfmt>tinypool: 2.1.2
